# Lints the staged files before each commit, with no
# autofix: any finding blocks the commit. The jobs run
# pnpm through scripts/pnpm-or-nix.sh, which goes
# through the Nix dev shell when pnpm isn't on the
# PATH, so commits work from outside the shell too.
# Typecheck and tests are left to CI.
pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: '*.{ts,mts,js,mjs,vue}'
      run: >-
        scripts/pnpm-or-nix.sh exec eslint
        --max-warnings 0 --no-warn-ignored
        {staged_files}
    - name: stylelint
      glob: '*.{scss,vue}'
      run: >-
        scripts/pnpm-or-nix.sh exec stylelint
        --max-warnings 0 --allow-empty-input
        {staged_files}
