# Packages the app with electron-builder. The release
# workflow runs it once per platform; locally, run
# `pnpm build`, then `pnpm exec electron-builder --mac`
# (or --linux, --win). The builds aren't signed
productName: Bulletin
appId: org.isidore.Bulletin

directories:
  # Where the icons are looked up
  buildResources: resources
  output: release

# electron-vite's output. Runtime dependencies are added
# from node_modules on top of these
files:
  - out/**
  - package.json

# The release workflow publishes with the GitHub CLI, and
# there's no auto-update: no update feed or app-update.yml
publish: null

# Drizzle's migrations, applied at startup (ADR 0001).
# The main process reads them from
# process.resourcesPath/migrations once packaged (see
# src/backend/storage/paths.ts). Only the SQL is needed
extraResources:
  - from: src/backend/storage/migrations
    to: migrations
    filter: ['**/migration.sql']

mac:
  category: public.app-category.lifestyle
  target: dmg
  icon: resources/icon.icns
  # Ad-hoc signature, no certificate: Apple Silicon won't
  # run an app without one. No hardened runtime, which
  # only matters for notarization
  identity: '-'
  hardenedRuntime: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  category: Office
  target: [AppImage, deb, rpm]
  # The standard icon sizes, taken from the .icns
  icon: resources/icon.icns
  # x64 only. ${arch} would differ per format (x86_64,
  # amd64)
  artifactName: ${productName}-${version}-linux-x64.${ext}
  # Names the .desktop entry after package.json's
  # desktopName, which Electron uses as the window's
  # app_id, so desktops group the window under it
  syncDesktopName: true

win:
  target: [nsis, portable]
  icon: resources/icon.ico

nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

portable:
  artifactName: >-
    ${productName}-${version}-win-${arch}-portable.${ext}
