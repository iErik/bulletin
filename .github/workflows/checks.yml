# Lints, type-checks, builds and tests the app. Runs on pull
# requests, and before every release (release.yml calls it)
name: Checks

on:
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    # Nothing here runs Electron, so skip its download
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      # The pnpm version comes from package.json's
      # packageManager field
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
