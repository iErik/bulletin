# Electron has no install script: package.json's
# postinstall fetches its binary instead. @parcel/watcher
# is only used by the Sass CLI's --watch mode, which Vite
# doesn't use.
# electron-winstaller (from electron-builder) only picks
# a 7-Zip binary for Squirrel.Windows, a target we don't
# build.
allowBuilds:
  '@parcel/watcher': false
  electron: false
  electron-winstaller: false
